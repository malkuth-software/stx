# The STXlib commit stx builds with (its state library shared, one per
# process; cmake/Stxlib.cmake): its process-wide SIMD level
# (include/stxlib/simd.hpp, in stxlib::algorithms), which stx_conv selects
# its lane variants through, and everything that level needs (stxlib::boundary
# and stxlib_state). cmake/Stxlib.cmake fetches this commit and installs those
# targets beside the stx packages; a local checkout replaces it with
# -DFETCHCONTENT_SOURCE_DIR_STXLIB=<dir>. GUI.Forms takes STXlib from the stx
# package (its row height index links stxlib::algorithms), so stx.lock is
# GUI.Forms' only pin for both.
#
# 5e9d1d6 is STXlib main: 23a0025 (the glyph face: stxlib::glyphs, the
# program's Typeface and a thread's Face, face_profile_version 1;
# stxlib::markdown), then 0fa7629 (the cmap format 6 and slot_of fix, the
# exact ink box, turned text, the shaper, unused by GUI.Forms until its
# parity hand-in, the appliance body, stx_minmallocpp's object-surface
# check, a web-build fix), then the glyph audit fixes with the
# malformed-font coverage and the Markdown audit fixes. State layout 13, as
# 23a0025: every module of a program takes STXlib from this one commit. It
# installs the same notices as 23a0025 (glyphs-NOTICE, markdown-NOTICE,
# whatwg-entities-LICENSE and the rest).
#
# 89c3ed6 is STXlib main: 5e9d1d6, then stxlib::textlayout (UAX #9, UAX
# #14 and UAX #24 at Unicode 18.0.0, in stxlib::algorithms), which replaces
# SheenBidi and libunibreak in GUI.Forms, with Paragraph/Line::bytes_held,
# bytes_peak and reset_peak and four audit fixes (45d1d1a), then vocab-copy:
# noexcept copies for Utf8String, Vector, Buffer, Path and PriorityQueue,
# and Optional<Utf8String> copies. STXlib carries no third-party code (its
# third_party holds data only). State layout 13, as 5e9d1d6; the same
# installed notices.
[stxlib]
repository = "malkuth-software/stxlib"
commit = "89c3ed6f0ab9e965001ae603e3dbc61b3f60b8af"
