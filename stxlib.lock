# The STXlib commit stx builds with (its state library shared, one per
# process; cmake/Stxlib.cmake): its process-wide SIMD level
# (include/stxlib/simd.hpp, in stxlib::algorithms), which stx_conv selects
# its lane variants through, and everything that level needs (stxlib::boundary
# and stxlib_state). cmake/Stxlib.cmake fetches this commit and installs those
# targets beside the stx packages; a local checkout replaces it with
# -DFETCHCONTENT_SOURCE_DIR_STXLIB=<dir>. GUI.Forms takes STXlib from the stx
# package (its row height index links stxlib::algorithms), so stx.lock is
# GUI.Forms' only pin for both.
#
# 1748441 is STXlib main after the 2026-11-15 pin round: b8fe565
# (stx_minmallocpp as the default allocator, thread records, Emscripten
# wasm32, the early-exit work, R5 and the math fixes) plus park_shadow_into
# and restore_shadow_from, the reporter-safe list (unwinder-only stack
# capture on Linux and FreeBSD), the stx_minmallocpp-NOTICE and
# unicode-LICENSE installs, the log(float) fix, C mimalloc removed (state
# layout 11: every module from this one pin), the Linux TSan thread-exit fix,
# and sc1's pace fix and float_exact edge contract. Pinned before STXlib's
# GitHub CI and M4 matrix finished, with STXlib's agreement.
[stxlib]
repository = "malkuth-software/stxlib"
commit = "174844118a9e8dddb32c7f21f319106be6845932"
