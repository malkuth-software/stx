# The STXlib commit stx builds with (its state library shared, one per
# process; cmake/Stxlib.cmake): its process-wide SIMD level
# (include/stxlib/simd.hpp, in stxlib::algorithms), which stx_conv selects
# its lane variants through, and everything that level needs (stxlib::boundary
# and stxlib_state). cmake/Stxlib.cmake fetches this commit and installs those
# targets beside the stx packages; a local checkout replaces it with
# -DFETCHCONTENT_SOURCE_DIR_STXLIB=<dir>. GUI.Forms takes STXlib from the stx
# package (its row height index links stxlib::algorithms), so stx.lock is
# GUI.Forms' only pin for both.
#
# 23a0025 is STXlib main after the glyph face (stx_gtraster 9dd9586 merged
# onto 9e87ab1): stxlib::glyphs (font_file.hpp, glyph_store.hpp,
# glyph_hinter.hpp, glyph_mask.hpp and glyph_face.hpp: the program's
# Typeface, a thread's Face, DrawStyle::thicken, limits in bytes,
# face_profile_version 1), compiled into stxlib::algorithms; stxlib::markdown
# (markdown.hpp) and the debugger anchor. State layout 13: every module of a
# program takes STXlib from this one commit. New notices installed by STXlib
# itself: glyphs-NOTICE, markdown-NOTICE and whatwg-entities-LICENSE.
[stxlib]
repository = "malkuth-software/stxlib"
commit = "23a00256d02a94aac862d432f3253243ab4ae2bb"
